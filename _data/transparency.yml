  - slug: appmeta
    manifest_source: source
    tracking_declared: false
    tracking_domains: 0
    third_party_sdks: 0
    third_party_sdks_list: []
    account_required: "An App Store Connect team API key (Issuer ID, Key ID, .p8) from your own developer account; no AppMeta account. Stored in the macOS Keychain on that Mac only and never transmitted to Lagerland."
    network_calls: "App Store Connect API (api.appstoreconnect.apple.com) and the report download links it returns; Apple's public App Store endpoints (apps.apple.com, itunes.apple.com, search.itunes.apple.com, amp-api-edge.apps.apple.com) for app icons, competitor prices and opt-in keyword research; Apple Ads (api.ads.apple.com, appleid.apple.com) only if you connect it; ECB exchange rates (data-api.ecb.europa.eu) for sales charts; your chosen AI provider, if any. No Lagerland server."
    data_leaves_device: "Listing data goes only to Apple's App Store Connect API, with your own key. Keyword phrases and app IDs you look up go to Apple's public App Store endpoints, and text you ask a cloud AI provider to translate or analyze goes to that provider. Nothing goes to Lagerland."
    analytics: "None."
    collected_data: []
    required_reason_apis:
      - "UserDefaults (CA92.1)"
    permissions:
      - "Notifications: optional alerts for new reviews and diagnostics"
    notes: "Native Mac client for App Store Connect. Edits happen locally, then submit via Apple's API."


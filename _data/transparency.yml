    account_required: "No Lagerland account. Your own App Store Connect API key."
    network_calls: "Apple's App Store Connect API (plus the analytics report download links it returns), Apple's iTunes Lookup and the app icons it points to, the App Store for purchases, Apple's Translation framework when you translate a review, the European Central Bank's public exchange-rate API, and, with iCloud Sync on, Apple's iCloud (CloudKit) and push service."
    data_leaves_device: "To App Store Connect with your own key (including review replies you send), and your apps' IDs to Apple's iTunes Lookup. With iCloud Sync on, your history, reviews, and settings (never the .p8 key) also go to your own private iCloud database. Nothing reaches Lagerland unless you email us."
    analytics: "None."
    collected_data: []
    required_reason_apis:
      - "UserDefaults (CA92.1, 1C8F.1)"
      - "File timestamp (C617.1)"
      - "Disk space (E174.1)"
    permissions: []
    notes: "Privacy manifests ship in the app and its widget. No build, pricing, or metadata controls; the only App Store Connect writes are review replies you send and analytics report requests."


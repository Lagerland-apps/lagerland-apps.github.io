    network_calls: "Workout data syncs through your own iCloud (CloudKit private database). Lagerland's own server (a Cloudflare Worker) receives a random install ID, the install date and an optional referral code on first launch, and the transaction ID, product and subscription dates when you buy Pro; the optional how-did-you-hear survey loads its coach list from the same server. No workout or health data is sent."
    data_leaves_device: "Workouts: your own iCloud, and Apple Health if you allow it. Lagerland's server: a random install ID, referral code and purchase records only."
    analytics: "No analytics SDK; a random install ID is used for referral attribution."
    collected_data:
      - "Health & Fitness (purpose: app functionality, not linked, not used for tracking)"
      - "Device ID: random install ID (purpose: app functionality, analytics; not linked, not used for tracking)"
    required_reason_apis:
      - "UserDefaults (CA92.1, 1C8F.1)"
      - "File timestamp (C617.1)"
      - "System boot time (35F9.1)"
    permissions:
      - "Apple Watch connectivity: log sets from the wrist while the iPhone runs the session"
      - "HealthKit: save workouts; read heart rate and active energy"
    notes: "1,500 exercises and 44 programs ship inside the app. The App Store label reads \"Data Not Collected\", while the app's own privacy manifest declares the two data types above."


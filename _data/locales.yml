    EUR: { symbol: "€", position: after, space: " ", decimals: 2, decimal: ",", group: "." }
  strings:
    free: "Kostenlos"
    from: "ab"
    per_month: "/Monat"
    per_year: "/Jahr"
    per_week: "/Woche"
    lifetime: "einmalig"

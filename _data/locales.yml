# One block per language (TRANSLATION.md 4.3). The key is the language code = folder name = page.lang.
#   territory    App Store Connect territory whose prices the language shows (catalog.json meta.territories)
#   html_lang    <html lang> value; hreflang: the hreflang codes this language's pages carry
#   og_locale    og:locale; dir: ltr or rtl; native_name: the name in the language switcher
#   live         false until the language's go-live commit. A language that is not live gets noindex on every
#                page, stays out of the sitemaps, the switcher, hreflang and the footer language links.
#   currencies   symbol, where it goes (before/after), decimals, decimal and group separators. Must match
#                what the App Store shows in that storefront (checked date in the language sheet).
#   strings      the standard price line ("Free, Premium from $3.99/mo, $24.99/yr, or $39.99 lifetime"),
#                the platform list join word and the free-trial label pattern ({n} = number of days/months).
en:
  territory: USA
  html_lang: en
  hreflang: [en]
  og_locale: en_US
  dir: ltr
  native_name: "English"
  live: true
  currencies:
    USD: { symbol: "$", position: before, decimals: 2, decimal: ".", group: "," }
  strings:
    free: "Free"
    from: "from"
    per_month: "/mo"
    per_year: "/yr"
    per_week: "/wk"
    lifetime: "lifetime"
    once: "once"
    or: "or"
    and: "and"
    one_time_purchase: "one-time purchase"
    default_tier: "Premium"
    family_sharing: "Family Sharing"
    decimal: "."
    serial_comma: ","
    trial_one_day: "1-day free trial"
    trial_one_month: "1-month free trial"
    trial_one_year: "1-year free trial"
    trial_days: "{n}-day free trial"
    trial_months: "{n}-month free trial"
    trial_years: "{n}-year free trial"
de:
  territory: DEU
  html_lang: de
  hreflang: [de]
  og_locale: de_DE
  dir: ltr
  native_name: "Deutsch"
  live: true
  # Checked 2026-10-26 in the German App Store (apps.apple.com/de): "9,99 €" with a no-break space (U+00A0).
  currencies:
    EUR: { symbol: "€", position: after, space: " ", decimals: 2, decimal: ",", group: "." }
  strings:
    free: "Kostenlos"
    from: "ab"
    per_month: "/Monat"
    per_year: "/Jahr"
    per_week: "/Woche"
    lifetime: "einmalig"
    once: "einmalig"
    or: "oder"
    and: "und"
    one_time_purchase: "Einmalkauf"
    default_tier: "Premium"
    family_sharing: "Familienfreigabe"
    decimal: ","
    serial_comma: ""
    trial_one_day: "1 Tag gratis testen"
    trial_one_month: "1 Monat gratis testen"
    trial_one_year: "1 Jahr gratis testen"
    trial_days: "{n} Tage gratis testen"
    trial_months: "{n} Monate gratis testen"
    trial_years: "{n} Jahre gratis testen"

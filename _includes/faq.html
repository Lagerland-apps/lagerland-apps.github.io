{%- assign fq_t = site.data.i18n[page.lang] | default: site.data.i18n.en -%}
{% if include.app.faq %}
<section id="faq" class="section reveal">
  <h2 class="h2">{{ fq_t.faq_heading }}</h2>
  <div class="faq">
    {% for item in include.app.faq %}
      <details class="faq-item">
        <summary>{{ item.q }}</summary>
        <div class="faq-a">{{ item.a }}</div>
      </details>
    {% endfor %}
  </div>
</section>
{% endif %}
